<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Primary SpringWeb Emerald-to-Teal Gradient -->
    <linearGradient id="swGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Secondary SpringWeb Cyan-to-Ocean-Blue Gradient -->
    <linearGradient id="swBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Full Emblem Dynamic Gradient -->
    <linearGradient id="swEmblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background Glow & Container -->
  <rect width="512" height="512" rx="100" fill="#04050a" />

  <!-- Outer Upper S-Curve (Green to Blue) -->
  <path d="M 340,110 C 260,60 140,80 140,180 C 140,240 180,260 220,285" 
        fill="none" 
        stroke="url(#swGreenGrad)" 
        stroke-width="38" 
        stroke-linecap="round" />

  <!-- Outer Lower S-Curve (Green to Blue) -->
  <path d="M 172,402 C 252,452 372,432 372,332 C 372,272 332,252 292,227" 
        fill="none" 
        stroke="url(#swBlueGrad)" 
        stroke-width="38" 
        stroke-linecap="round" />

  <!-- Center Monogram 'W' (Green Left Arm) -->
  <path d="M 145,230 L 210,360 L 260,250" 
        fill="none" 
        stroke="url(#swGreenGrad)" 
        stroke-width="40" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Center Monogram 'W' (Blue Right Arm) -->
  <path d="M 260,250 L 310,360 L 375,230" 
        fill="none" 
        stroke="url(#swBlueGrad)" 
        stroke-width="40" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>