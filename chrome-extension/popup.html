<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpringWeb Instant Lead Scraper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="icons/icon48.png" alt="SpringWeb Logo" class="brand-logo">
        <div>
          <h1>SpringWeb Scraper</h1>
          <span class="subtitle">Google Maps Real-Time Lead Engine</span>
        </div>
      </div>
      <div class="status-badge" id="statusBadge">Connected</div>
    </header>

    <!-- Main Content -->
    <main class="content">
      <!-- Action Buttons -->
      <div class="action-card">
        <button id="btnScrapePage" class="btn btn-primary">
          <span class="icon">⚡</span>
          <span>Scrape Current Maps Page</span>
        </button>

        <button id="btnAutoScroll" class="btn btn-secondary">
          <span class="icon">🔄</span>
          <span>Auto-Scroll &amp; Scrape Next 50</span>
        </button>
      </div>

      <!-- Live Counters -->
      <div class="metrics-grid">
        <div class="metric">
          <span class="value" id="valFound">0</span>
          <span class="label">Found</span>
        </div>
        <div class="metric">
          <span class="value" id="valCleaned">0</span>
          <span class="label">Cleaned</span>
        </div>
        <div class="metric highlight">
          <span class="value" id="valSynced">0</span>
          <span class="label">Synced</span>
        </div>
      </div>

      <!-- Real-Time Sync Action -->
      <div class="sync-section">
        <button id="btnSyncAdmin" class="btn btn-emerald" disabled>
          <span class="icon">🚀</span>
          <span>Sync All Cleaned Leads to Admin Panel</span>
        </button>
      </div>

      <!-- Live Preview Table -->
      <div class="preview-container">
        <div class="table-header">
          <span>Live Scraped Leads</span>
          <span id="leadCountBadge" class="badge">0 leads</span>
        </div>
        <div class="table-wrapper" id="previewList">
          <div class="empty-state">
            <span class="empty-icon">📍</span>
            <p>Open Google Maps search results (e.g. <em>"Hotels in Udumalpet"</em> or <em>"Mills in Tiruppur"</em>) and click <strong>Scrape Current Maps Page</strong>.</p>
          </div>
        </div>
      </div>

      <!-- Export Footer -->
      <footer class="footer-actions">
        <button id="btnExportCsv" class="btn-text">Export CSV</button>
        <button id="btnExportJson" class="btn-text">Export JSON</button>
        <a href="https://suite.springwebsolutions.in/lead-gen" target="_blank" class="btn-text highlight">Admin Panel ↗</a>
      </footer>
    </main>
  </div>

  <script src="cleaner.js"></script>
  <script src="popup.js"></script>
</body>
</html>
